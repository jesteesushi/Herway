name: Daily Incident Ingest Cron

on:
  schedule:
    # Runs at 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingest Endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: HerWay-Cron/1.0"
